# 04-load-generator.yaml - PSI5120 Avaliacao Intermediaria 1
# Gerador de carga (teste de estresse). Um Pod que envia requisicoes HTTP em
# laco infinito para o Service "web", elevando a utilizacao de CPU dos Pods e
# forcando o HPA a escalar. Aplicar este manifesto INICIA o teste de estresse;
# removê-lo (kubectl delete) ENCERRA a carga e permite observar a reducao de replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: av1
  labels:
    app: load-generator
spec:
  # Numero de geradores concorrentes. Mais replicas = mais carga simultanea.
  # 5 geradores costumam ser suficientes para saturar o alvo de 50% de CPU.
  replicas: 5
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          # Laco infinito de requisicoes ao Service interno "http://web".
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O- http://web > /dev/null; done"
